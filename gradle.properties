AMQPusername=guest
AMQPpassword=guest
AMQPurl=localhost:5672
AMQPvhost=/
AMQPexchange=shinkai-kempo-notifications
AMQPpublishroutingkey=user
AMQPsubscriberoutingkey=user

MAPBOX_PUBLIC_TOKEN=
MAPBOX_ACCESS_TOKEN=

API_BASE_URL=https://shinkai.ktsd.dscloud.me:40443/api/v1/
